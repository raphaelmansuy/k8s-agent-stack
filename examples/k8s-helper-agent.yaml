# Agent - The "Logic" that binds brain and hands
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: k8s-helper-agent
  namespace: kagent
spec:
  declarative:
    modelConfig: gpt-4o-mini
    systemMessage: |
      You are a Kubernetes helper assistant. 
      You can help users understand their Kubernetes cluster, list resources, 
      get information about pods, services, and deployments.
      Always be helpful and provide clear, concise information.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kagent-tool-server
          toolNames: 
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_pod_logs
            - k8s_get_events
