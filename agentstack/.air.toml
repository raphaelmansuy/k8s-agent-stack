root = "."
tmp_dir = "tmp"

[build]
  bin = "./bin/agentstack-api"
  cmd = "go build -o ./bin/agentstack-api ./cmd/api"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "node_modules", "bin", "migrations"]
  exclude_file = []
  exclude_regex = ["_test.go", ".*_gen.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
  kill_delay = "2s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
