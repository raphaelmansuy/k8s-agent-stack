version: "2"
run:
  go: "1.24"
linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - godot
    - goprintffuncname
    - gosec
    - intrange
    - makezero
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - unconvert
    - unparam
    - wastedassign
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - performance
        - style
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - ifElseChain
        - typeAssertChain
        - unnamedResult
        - importShadow
        - emptyStringTest
        - exitAfterDefer
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: ".*_test\\.go"
      linters:
        - errcheck
        - gocritic
        - govet
        - revive
        - unusedwrite
    - path: ".*_test\\.go"
      linters:
        - gosec
      text: "G104:"
    - path: ".*_test\\.go"
      linters:
        - gosec
      text: "G101:"

    - path: cmd/
      linters:
        - gochecknoglobals
    - path: examples/
      linters:
        - gosec
        - errcheck
    - linters:
        - gocritic
      text: "whyNoLint" # We already fixed some, but let's not be too strict on others for now
    - linters:
        - gosec
      text: "G115: integer overflow conversion" # This is very noisy in Go 1.24, should be handled case-by-case but for now let's suppress the noise


formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/raphaelmansuy/agentstack
