apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: google-adk-agent
  namespace: kagent
spec:
  description: A Google ADK-based agent with weather, time, and math calculation tools
  type: Declarative
  declarative:
    modelConfig: default-model-config
    systemMessage: |
      You are a helpful assistant with access to weather information, time data, and mathematical calculations.
      
      You can:
      - Provide weather information for cities
      - Tell the current time in different timezones (San Francisco, New York, London, Tokyo, or UTC)
      - Perform mathematical calculations using Python expressions
      
      Be concise and helpful in your responses.
    
    # Since we can't easily convert Python functions to MCP tools,
    # we'll use the agent's code execution capabilities if available
    # For now, let's just use the agent without custom tools
    a2aConfig:
      skills:
      - id: weather-info
        name: Weather Information
        description: Get weather information for cities
        examples:
        - "What's the weather in San Francisco?"
        - "Tell me the weather in New York"
        - "How's the weather in London?"
        inputModes:
        - text
        outputModes:
        - text
        tags:
        - weather
        - information
      - id: time-info
        name: Time Information
        description: Get current time in different timezones
        examples:
        - "What time is it in Tokyo?"
        - "Tell me the current time in London"
        - "What's the time in San Francisco?"
        inputModes:
        - text
        outputModes:
        - text
        tags:
        - time
        - timezone
      - id: math-calculations
        name: Math Calculations
        description: Perform mathematical calculations
        examples:
        - "Calculate 25 * 4"
        - "What is 100 / 5?"
        - "Compute (10 + 5) * 3"
        inputModes:
        - text
        outputModes:
        - text
        tags:
        - math
        - calculation
